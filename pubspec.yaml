name: unifei_mobile
description: "Aplicativo institucional da PRG/UNIFEI, desenvolvido pela Asimov Jr."
# Impede que o pacote seja publicado por engano no pub.dev com
# `flutter pub publish`.
publish_to: 'none'

# Versão e número de build do app, no formato 1.2.43+1. Os dois podem ser
# sobrescritos no build com --build-name e --build-number.
# No Android, build-name vira versionName e build-number vira versionCode.
# No iOS, build-name vira CFBundleShortVersionString e build-number vira
# CFBundleVersion.
# No Windows, build-name forma as partes major, minor e patch da versão, e
# build-number vira o sufixo de build.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Pacotes usados pelo app. `flutter pub outdated` lista os que têm versão nova.
dependencies:
  flutter:
    sdk: flutter

  # Fonte de ícones do estilo iOS (classe CupertinoIcons).
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Regras de lint recomendadas, ativadas no `analysis_options.yaml`.
  flutter_lints: ^6.0.0

# Seção específica do Flutter.
# Referência do arquivo: https://dart.dev/tools/pub/pubspec
flutter:

  # Inclui a fonte dos ícones do Material (classe Icons).
  uses-material-design: true

  # Imagens e outros arquivos do app ficam na seção `assets`:
  # assets:
  #   - images/exemplo.png
  # Referência: https://flutter.dev/to/resolution-aware-images

  # Fontes próprias ficam na seção `fonts`. Este projeto usa o pacote
  # `google_fonts`, então a seção não é necessária.
  # Referência: https://flutter.dev/to/font-from-package
