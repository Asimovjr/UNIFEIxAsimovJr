# Configuração do analisador, que verifica o código Dart em busca de erros,
# avisos e problemas de lint. Os problemas aparecem na IDE e também com
# `flutter analyze`.

# Ativa o conjunto de lints recomendado para apps Flutter.
include: package:flutter_lints/flutter.yaml

linter:
  # Regras ativadas ou desativadas em relação ao conjunto acima. Lista
  # completa: https://dart.dev/lints
  #
  # Uma regra também pode ser ignorada só em uma linha ou arquivo, com
  # `// ignore: nome_da_regra` ou `// ignore_for_file: nome_da_regra`.
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true
    use_named_constants: true

# Referência: https://dart.dev/guides/language/analysis-options
