name: Flutter CI

on:
  pull_request:
    branches:
      - main

# jobs

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Mesma versão do README. O phosphor_flutter 2.1.0 não compila em
          # versões mais novas, que tornaram a classe IconData final.
          flutter-version: 3.41.7
          cache: true

      - name: install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test