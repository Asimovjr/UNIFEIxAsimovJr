name: Flutter CI

on:
  pull_request:
    branches:
      - main

# jobs

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test